services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-imago}
      POSTGRES_USER: ${POSTGRES_USER:-imago}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: imago-pubco:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-imago}
      PGUSER: ${POSTGRES_USER:-imago}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${IMAGO_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
